<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }

  html, body {
    width:100%; height:100%;
    background:#0e0e0e;
    color:#e8e8e8;
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
  }

  body { -webkit-app-region:drag; }
  button { -webkit-app-region:no-drag; }

  .wordmark {
    position:absolute; top:20px; left:24px;
    font-size:11px; font-weight:500; letter-spacing:0.3em;
    color:#666;
  }

  .center {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    height:100%; gap:0;
  }

  .icon-assembly {
    position:relative; width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
  }

  .ring-svg { position:absolute; top:0; left:0; width:260px; height:260px; }

  .web-icon { width:90px; height:90px; position:relative; z-index:2; }

  #state-label {
    font-size:10px; font-weight:500;
    letter-spacing:0.25em; text-transform:uppercase;
    color:#666; margin-bottom:18px;
    transition:color 0.35s ease;
  }

  .divider { width:280px; height:1px; background:#1a1a1a; margin-bottom:18px; }

  #last-response {
    font-size:12px; font-weight:300;
    color:#666; text-align:center;
    max-width:480px; line-height:1.7;
    min-height:40px; padding:0 40px;
    transition:color 0.3s ease;
  }

  .bottom-bar {
    position:absolute; bottom:0; left:0; right:0;
    height:44px; border-top:1px solid #1a1a1a;
    display:flex; align-items:center;
    justify-content:space-between; padding:0 24px;
  }

  .meta-row { display:flex; gap:20px; }

  .meta { font-size:9px; letter-spacing:0.12em; color:#555; }
  .meta .lbl { margin-right:5px; opacity:0.5; }

  .btn-row { display:flex; gap:10px; -webkit-app-region:no-drag; }

  .btn {
    background:none; border:1px solid #1e1e1e;
    color:#555; font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:0.12em;
    padding:3px 9px; cursor:pointer;
    transition:border-color 0.2s, color 0.2s;
  }
  .btn:hover { border-color:#8B0000; color:#e8e8e8; }

  /* light mode */
  body.light { background:#f4f1ed; color:#1a1a1a; }
  body.light .wordmark      { color:#8B6914; }
  body.light #state-label   { color:#8B6914; }
  body.light .divider       { background:#ddd9d2; }
  body.light #last-response { color:#8B6914; }
  body.light .bottom-bar    { border-top-color:#ddd9d2; }
  body.light .meta          { color:#8B6914; }
  body.light .btn           { border-color:#ddd9d2; color:#8B6914; }
  body.light .btn:hover     { border-color:#a0720f; color:#1a1a1a; }

  @keyframes spin-cw    { from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }
  @keyframes spin-ccw   { from{transform:rotate(0deg)}  to{transform:rotate(-360deg)} }
  @keyframes breathe    { 0%,100%{opacity:0.4} 50%{opacity:0.95} }
  @keyframes pulse-node { 0%,100%{r:3} 50%{r:5} }
</style>
</head>
<body>

<div class="wordmark">ARCN</div>

<div class="center">
  <div class="icon-assembly">
    <svg class="ring-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <g id="outer-group" style="transform-origin:130px 130px">
        <path id="oa1" d="M130,15 A115,115 0 0,1 226,72"   fill="none" stroke-width="1" stroke-linecap="round"/>
        <path id="oa2" d="M226,188 A115,115 0 0,1 130,245" fill="none" stroke-width="1" stroke-linecap="round"/>
        <path id="oa3" d="M34,188  A115,115 0 0,1 34,72"   fill="none" stroke-width="1" stroke-linecap="round"/>
        <path id="oa4" d="M130,245 A115,115 0 0,1 34,188"  fill="none" stroke-width="1" stroke-linecap="round"/>
        <circle id="on1" cx="130" cy="15"  r="3.5"/>
        <circle id="on2" cx="226" cy="72"  r="3"/>
        <circle id="on3" cx="226" cy="188" r="3.5"/>
        <circle id="on4" cx="130" cy="245" r="3"/>
        <circle id="on5" cx="34"  cy="188" r="3.5"/>
        <circle id="on6" cx="34"  cy="72"  r="3"/>
      </g>
      <g id="inner-group" style="transform-origin:130px 130px">
        <path id="ia1" d="M130,48 A82,82 0 0,1 201,89"  fill="none" stroke-width="1" stroke-linecap="round"/>
        <path id="ia2" d="M201,171 A82,82 0 0,1 59,171" fill="none" stroke-width="1" stroke-linecap="round"/>
        <path id="ia3" d="M59,89  A82,82 0 0,1 130,48"  fill="none" stroke-width="1" stroke-linecap="round"/>
        <circle id="in1" cx="130" cy="48"  r="2.5"/>
        <circle id="in2" cx="201" cy="89"  r="3"/>
        <circle id="in3" cx="201" cy="171" r="2.5"/>
        <circle id="in4" cx="59"  cy="171" r="3"/>
        <circle id="in5" cx="59"  cy="89"  r="2.5"/>
      </g>
    </svg>

    <img id="web-icon" class="web-icon" src="http://localhost:7373/icon" alt="">
  </div>

  <span id="state-label">idle</span>
  <div class="divider"></div>
  <p id="last-response">—</p>
</div>

<div class="bottom-bar">
  <div class="meta-row">
    <div class="meta"><span class="lbl">time</span><span id="clock">—</span></div>
    <div class="meta"><span class="lbl">last</span><span id="last-intent">—</span></div>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="toggleTheme()">theme</button>
    <button class="btn" onclick="window.pywebview.api.hide()">hide</button>
  </div>
</div>

<script>
  const og         = document.getElementById("outer-group");
  const ig         = document.getElementById("inner-group");
  const wicon      = document.getElementById("web-icon");
  const slabel     = document.getElementById("state-label");
  const sresp      = document.getElementById("last-response");
  const intentEl   = document.getElementById("last-intent");
  const clockEl    = document.getElementById("clock");

  const outerArcs  = ["oa1","oa2","oa3","oa4"].map(id => document.getElementById(id));
  const innerArcs  = ["ia1","ia2","ia3"].map(id => document.getElementById(id));
  const outerNodes = ["on1","on2","on3","on4","on5","on6"].map(id => document.getElementById(id));
  const innerNodes = ["in1","in2","in3","in4","in5"].map(id => document.getElementById(id));

  let isLight   = false;
  let lastState = "";

  const DARK = {
    idle:       { arc:"rgba(139,0,0,0.45)",   node:"rgba(139,0,0,0.55)" },
    listening:  { arc:"rgba(192,57,43,0.75)", node:"rgba(192,57,43,0.95)" },
    processing: { arc:"rgba(192,57,43,0.55)", node:"rgba(192,57,43,0.75)" },
    speaking:   { arc:"rgba(192,57,43,0.55)", node:"rgba(192,57,43,0.75)" },
  };

  const LIGHT = {
    idle:       { arc:"rgba(200,160,40,0.35)", node:"rgba(200,160,40,0.50)" },
    listening:  { arc:"rgba(200,160,40,0.85)", node:"rgba(200,160,40,0.95)" },
    processing: { arc:"rgba(200,160,40,0.60)", node:"rgba(200,160,40,0.80)" },
    speaking:   { arc:"rgba(200,160,40,0.65)", node:"rgba(200,160,40,0.85)" },
  };

  const SPIN = {
    idle:       { outer:null,                           inner:null },
    listening:  { outer:"spin-cw 10s linear infinite",  inner:"spin-ccw 6s linear infinite" },
    processing: { outer:"spin-cw 5s linear infinite",   inner:"spin-ccw 3.5s linear infinite" },
    speaking:   { outer:"spin-cw 16s linear infinite",  inner:"spin-ccw 10s linear infinite" },
  };

  function applyColors(s) {
    const C = isLight ? LIGHT[s] : DARK[s];
    [...outerArcs,...innerArcs].forEach(a => a.setAttribute("stroke", C.arc));
    outerNodes.forEach(n => { n.setAttribute("fill", C.node); n.setAttribute("r","3.5"); });
    innerNodes.forEach(n => { n.setAttribute("fill", C.node); n.setAttribute("r","3"); });
  }

  function applyState(state, response, intent) {
    if (state === lastState && !response) return;
    lastState = state;

    og.style.animation = SPIN[state].outer || "none";
    ig.style.animation = SPIN[state].inner || "none";

    if (state === "listening" || state === "speaking") {
      const dur = state === "listening" ? "2.2s" : "2.8s";
      wicon.style.animation = `breathe ${dur} ease-in-out infinite`;
      wicon.style.opacity   = "";
    } else {
      wicon.style.animation = "none";
      wicon.style.opacity   = state === "processing" ? "0.65" : "0.4";
    }

    const np = state === "listening" ? "pulse-node 1.2s ease-in-out infinite" : "none";
    [...outerNodes,...innerNodes].forEach(n => n.style.animation = np);

    const activeColor = isLight ? "#a0720f" : "#c0392b";
    const idleColor   = isLight ? "#8B6914" : "#666";
    slabel.textContent = state;
    slabel.style.color = state === "idle" ? idleColor : activeColor;

    if (state === "speaking" && response) {
      sresp.textContent = response;
      sresp.style.color = isLight ? "#8B6914" : "#e8e8e8";
    } else if (state === "idle") {
      sresp.style.color = isLight ? "#8B6914" : "#666";
    }

    if (intent) intentEl.textContent = intent;

    applyColors(state);
  }

  function updateClock() {
    const n = new Date();
    clockEl.textContent = [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(v => String(v).padStart(2,"0")).join(":");
  }
  setInterval(updateClock, 1000);
  updateClock();

  function poll() {
    fetch("http://localhost:7373/state")
      .then(r => r.json())
      .then(d => applyState(d.state, d.response, d.intent))
      .catch(() => {});
  }
  setInterval(poll, 500);
  poll();

  function toggleTheme() {
    isLight = !isLight;
    document.body.classList.toggle("light", isLight);
    // white icon needs invert on light background
    wicon.style.filter = isLight ? "invert(1)" : "none";
    applyColors(lastState || "idle");
  }
</script>

</body>
</html>
